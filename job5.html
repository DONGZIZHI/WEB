<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>job5 在线购物折扣网站</title>

<style>
body{font-family:Arial,"Microsoft YaHei";margin:20px}
.row{margin:10px 0}
label{display:inline-block;width:100px}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
#clock{font-weight:bold;margin:10px 0}
#tips,#orderResult{background:#f7f7f7;padding:10px;margin-top:10px}
#log{background:#eef;border:1px solid #99f;padding:10px;margin-top:10px;max-height:200px;overflow:auto}
</style>

<script>
document.write("<div>提示：VIP九折，加急加价，前十分钟85折</div>");

var orders = [];

function updateClock(){
    var d=new Date();
    var m=d.getMinutes();
    var h=d.getHours();
    var s=d.getSeconds();
    var msg=(m<=9)?"前十分钟，85折":"非前十分钟，无折扣但有提醒";
    document.getElementById("clock").innerHTML=
        "当前时间："+h+":"+m+":"+s+" "+msg;
}

function processOrder(name,price,qty,isVip,isUrgent){
    var baseTotal=price*qty;
    var afterVip=isVip?baseTotal*0.9:baseTotal;
    var afterUrgent=isUrgent?afterVip*1.1:afterVip;

    var minute=new Date().getMinutes();
    var hitTimeDiscount=(minute>=0&&minute<=9);
    var finalTotal=hitTimeDiscount?afterUrgent*0.85:afterUrgent;

    if(isVip&&finalTotal>1000){
        finalTotal=finalTotal-50;
        if(finalTotal<0)finalTotal=0;
    }

    var tipsHtml="";
    tipsHtml+="<p>基础金额："+baseTotal.toFixed(2)+"</p>";
    tipsHtml+="<p>VIP折扣后："+afterVip.toFixed(2)+"</p>";
    tipsHtml+="<p>加急处理后："+afterUrgent.toFixed(2)+"</p>";
    tipsHtml+="<p>成交金额："+finalTotal.toFixed(2)+"</p>";
    document.getElementById("tips").innerHTML=tipsHtml;

    orders.push({
        name:name,
        price:price,
        qty:qty,
        baseTotal:baseTotal,
        finalTotal:finalTotal,
        isVip:isVip,
        isUrgent:isUrgent,
        hitTimeDiscount:hitTimeDiscount
    });

    var logLine =
        "客户名称："+name+
        " ｜ 购买数量："+qty+
        " ｜ 成交金额："+finalTotal.toFixed(2)+" 元<br>";
    document.getElementById("log").innerHTML += logLine;

    renderDashboard();
}

function validateForm() {

    var nameStr = document.getElementById("customerName").value;
    var priceStr = document.getElementById("priceInput").value;
    var qtyStr = document.getElementById("qtyInput").value;
    var typeStr = document.getElementById("customerType").value;
    var urgentChecked = document.getElementById("urgentFlag").checked;

    var valid = true;

    if (nameStr == null || nameStr.trim() === "") {
        alert("客户名称不能为空！");
        valid = false;
    }

    var price = parseFloat(priceStr);
    if (isNaN(price) || price <= 0) {
        alert("商品单价必须是大于 0 的数字！");
        valid = false;
    }

    var qty = parseInt(qtyStr, 10);
    if (isNaN(qty) || qty <= 0) {
        alert("数量必须是大于 0 的整数！");
        valid = false;
    }

    if (!valid) {
        document.getElementById("orderResult").innerHTML =
            "<p>订单录入失败，请检查输入。</p>";
        return false;
    }

    processOrder(nameStr.trim(), price, qty, typeStr === "vip", urgentChecked);
    return false;
}

function renderDashboard() {

    var count = orders.length;
    var totalSales = 0;

    for (var i = 0; i < orders.length; i++) {
        totalSales += orders[i].finalTotal;
    }

    var avg = count > 0 ? totalSales / count : 0;

    document.getElementById("dashboard").innerHTML =
        "<p>订单数：" + count + "</p>" +
        "<p>销售总额：￥" + totalSales.toFixed(2) + "</p>" +
        "<p>平均客单价：￥" + avg.toFixed(2) + "</p>";

    var tableHtml = "<table><tr>" +
        "<th>客户名称</th><th>商品单价</th><th>购买数量</th><th>原始总价</th><th>成交金额</th><th>是否VIP客户</th><th>是否加急发货</th><th>是否享受时间折扣</th>" +
        "</tr>";

    for (var j = 0; j < orders.length; j++) {
        var o = orders[j];
        tableHtml += "<tr>" +
            "<td>" + o.name + "</td>" +
            "<td>" + o.price.toFixed(2) + "</td>" +
            "<td>" + o.qty + "</td>" +
            "<td>" + o.baseTotal.toFixed(2) + "</td>" +
            "<td>" + o.finalTotal.toFixed(2) + "</td>" +
            "<td>" + (o.isVip ? "是" : "否") + "</td>" +
            "<td>" + (o.isUrgent ? "是" : "否") + "</td>" +
            "<td>" + (o.hitTimeDiscount ? "是" : "否") + "</td>" +
            "</tr>";
    }

    tableHtml += "</table>";
    document.getElementById("orderTable").innerHTML = tableHtml;
}
window.onload=function(){
    updateClock();
    setInterval(updateClock,1000);
};
</script>
</head>

<body>
<h2>在线购物折扣网站 job5</h2>

<div id="clock"></div>

<form onsubmit="return validateForm();">
<div class="row"><label>客户名称</label><input id="customerName"></div>
<div class="row"><label>商品单价</label><input id="priceInput"></div>
<div class="row"><label>数量</label><input id="qtyInput"></div>
<div class="row">
<label>客户类型</label>
<select id="customerType">
<option value="normal">普通</option>
<option value="vip">VIP</option>
</select>
</div>
<div class="row"><label>加急</label><input type="checkbox" id="urgentFlag"></div>
<button type="submit">添加订单</button>
</form>

<div id="orderResult"></div>
<div id="tips"></div>

<h3>实时成交记录</h3>
<div id="log"></div>

<div id="dashboard"></div>
<div id="orderTable"></div>

</body>
</html>
